[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openresearch"
version = "0.2.0"
description = "AI Research & Executive Intelligence Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    # LLM providers
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    # Orchestration
    "langgraph>=0.1.0",
    # API server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    # Data validation
    "pydantic>=2.0.0",
    # Stock data
    "yfinance>=0.2.36",
    "httpx>=0.27.0",
    # Config & templating
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    # Logging & utilities
    "structlog>=23.0.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "httpx>=0.27.0",   # for FastAPI TestClient
]

[project.scripts]
openresearch = "openresearch.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "schemas*", "pipelines*", "integrations*"]
