# ─────────────────────────────────────────────────────────────────────────────
# OpenResearch Configuration
#
# Edit this file to configure LLM providers, stock data sources, and
# executive board integrations.
# ─────────────────────────────────────────────────────────────────────────────


# ── LLM Provider Chain ────────────────────────────────────────────────────────
# Providers are tried left-to-right. Falls back to the next on rate limit.
# Supported providers: anthropic, openai, minimax, openai_compatible (local LLM)
#
# For local LLM (LM Studio / Ollama):
#   Set provider to "openai_compatible", base_url to your endpoint,
#   model to the loaded model name, and api_key to any placeholder string.

llm:
  provider_chain:
    - provider: anthropic
      model: claude-sonnet-4-6
      api_key: ""             # get from console.anthropic.com

    # Uncomment to add a local LLM fallback (LM Studio / Ollama):
    # - provider: openai_compatible
    #   base_url: http://localhost:1234/v1
    #   model: qwen3-27b      # or any model loaded in LM Studio / Ollama
    #   api_key: lm-studio    # placeholder — not validated by local servers


# ── Stock Research ────────────────────────────────────────────────────────────

stock_research:
  data_sources:
    yahoo_finance: true             # free, no key needed
    alpha_vantage_key: ""           # free tier: 25 req/day — alphavantage.co
    polygon_key: ""                 # free tier: 5 req/min  — polygon.io
    news_api_key: ""                # free tier: 100 req/day — newsapi.org
  cache_ttl_hours: 4               # cache research results for 4 hours


# ── Executive Board ───────────────────────────────────────────────────────────

executive_board:
  board_members:
    - chief_of_staff
    - vp_engineering
    - vp_product
    - vp_people
    - cto
    - cfo_proxy
  parallel_execution: true         # run board members concurrently
  max_retries: 2

  integrations:
    jira:
      base_url: ""                  # e.g. https://yourorg.atlassian.net
      api_token: ""                 # Jira API token
      email: ""                     # your Atlassian account email

    linear:
      api_key: ""                   # Linear API key — linear.app/settings/api

    notion:
      api_key: ""                   # Notion integration token
      database_ids: []              # list of database IDs to query

    slack:
      bot_token: ""                 # Bot Token (xoxb-...) — read-only scopes only
                                    # Required scopes: channels:history, channels:read
      channel_ids: []               # explicit list of channel IDs to read
                                    # e.g. ["C01234ABCDE", "C09876ZYXWV"]
      days_back: 7                  # how many days of history to fetch

    documents:
      folder_path: ""               # path to folder containing .docx / .pdf / .txt / .md files
      file_extensions:              # which file types to load
        - ".docx"
        - ".pdf"
        - ".txt"
        - ".md"
      max_file_mb: 10               # skip files larger than this

  # Team mapping — used to group Jira/Linear data by VP
  jira_project_keys: []            # e.g. ["ENG", "PRODUCT", "INFRA"]
  linear_team_keys: []             # e.g. ["engineering", "product", "platform"]


# ── Interview Research ────────────────────────────────────────────────────────
# Prepares for job interviews: fit analysis, company intel, tailored questions,
# STAR answers, and a tailored resume generated from the candidate's profile.

interview_research:
  # depth: "full" runs all 5 nodes including ResumeWriter (recommended).
  # depth: "quick" skips company research and resume writing — for testing.
  default_depth: full

  # Local storage directory for profile, application tracker, and skills bank.
  # All three files are written here: profile.json, applications.json, skills.json
  # Also generates applications.md (human-readable markdown table).
  data_dir: data


# ── MCP (Model Context Protocol) ─────────────────────────────────────────────
# Enables live web search for company research and vault export to Tolaria.
#
# brave_search_key:
#   Enables live web research in CompanyResearcherAgent (Node 2).
#   Without it, company intel uses LLM training knowledge only.
#   Get a free key at https://api.search.brave.com/
#
# tolaria:
#   Saves research briefs and tailored resumes to your Tolaria vault.
#   Tolaria exposes an Obsidian-compatible Local REST API at localhost:27123.
#   Set export_to_tolaria=true in POST /api/interview-prep or /api/stock-research.

mcp:
  brave_search_key: ""            # Brave Search API key — api.search.brave.com (free tier: 2000 req/mo)

  # ── Equibles (self-hosted financial data MCP server) ───────────────────────
  # Provides SEC filings (full-text), 13F institutional holdings, insider trades
  # (Form 3/4), congressional disclosures, FINRA short volume, SEC fails-to-deliver,
  # FRED economic indicators, CFTC futures positioning, CBOE VIX/put-call, and
  # daily prices + technical indicators — all from your own machine, no cloud
  # dependency, no API keys required.
  #
  # Setup (one time):
  #   git clone https://github.com/daniel3303/Equibles && cd Equibles
  #   docker compose up -d
  #
  # After the containers are up, set enabled: true below.
  # Web portal: http://localhost:8080  |  MCP SSE: http://localhost:8081/sse
  #
  # Optional free API keys for additional data:
  #   finra_key:  https://gateway.finra.org/  (FINRA short volume)
  #   fred_key:   https://fred.stlouisfed.org/ (FRED economic indicators)
  equibles:
    enabled: false                # set true once `docker compose up` is running
    server_url: "http://localhost:8081"   # Equibles MCP server (port 8081)
    # tickers: []                 # leave empty to sync all tickers, or restrict:
    #   tickers: ["AAPL", "NVDA", "MSFT"]

  tolaria:
    enabled: false                # set true once Tolaria server is running
    server_url: "http://localhost:27123"   # Tolaria / Obsidian Local REST API endpoint
    api_key: ""                   # leave blank if no auth required (local use)
    vault_folder: "OpenResearch"  # root folder in your Tolaria/Obsidian vault
    local_fallback_dir: "output"  # fallback directory when Tolaria is unreachable


# ── Real Estate Research ─────────────────────────────────────────────────────
# Analyses migration demand, labor market, housing, cost-of-living, and
# climate/flood risk for a target city+state (+ optional address for property-level
# flood zone lookup).
#
# All data sources are free or have a free tier.
# BLS and Census have no key requirement. FRED, BEA, and Census accept keys for
# higher rate limits (still work without keys at lower request limits).

real_estate_research:
  data_sources:
    fred_api_key: ""          # api.stlouisfed.org — free, get at fred.stlouisfed.org/docs/api/api_key.html
    bea_api_key: ""           # apps.bea.gov/api — free, register at apps.bea.gov/API/signup
    census_api_key: ""        # api.census.gov — free, get at api.census.gov/data/key_signup.html
    walk_score_api_key: ""    # api.walkscore.com — free tier 1k req/day, register at walkscore.com/professional/api.php
    noaa_cdo_token: ""        # ncei.noaa.gov/cdo-web/api — free, get at ncei.noaa.gov/cdo-web/token
    first_street_api_key: ""  # firststreet.org — free research tier, api.firststreet.org
    rentcast_api_key: ""      # api.rentcast.io — free tier 50 req/mo; property-specific rent estimates

  # Local cache directories for Zillow/Redfin/IRS bulk files.
  # If empty, the pipeline downloads CSVs on first run (adds ~10-30s latency).
  # Recommended: pre-download monthly and cache locally.
  zillow_cache_dir: "data/realestate/zillow/"   # put Zillow Research CSVs here
  redfin_cache_dir: "data/realestate/redfin/"   # put Redfin Data Center TSV here
  irs_cache_dir: "data/realestate/irs/"         # put IRS SOI migration CSV extracts here

  # Default documents directory for real estate doc ingestion
  documents_dir: "data/realestate/docs/"        # PDFs, MDs, TXTs about the property/market


# ── OCR (Scanned PDF Support) ─────────────────────────────────────────────────
# Automatically detects image-based (scanned) PDFs and OCRs them using
# Claude vision. Uses the Anthropic key from llm.provider_chain by default.
# Set enabled: false to skip OCR and treat scanned pages as empty.

ocr:
  enabled: true
  model: claude-haiku-4-5-20251001    # vision model used for OCR (fast + cheap)
  dpi: 200                             # page render resolution (higher = more accurate, slower)
  api_key: ""                          # leave blank to reuse llm.provider_chain anthropic key


# ── Server ────────────────────────────────────────────────────────────────────

server:
  host: "127.0.0.1"
  port: 7842
  cors_origins:
    - "chrome-extension://*"
    - "http://localhost:*"
